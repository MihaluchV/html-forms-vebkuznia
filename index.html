<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ВебКузня: форма запису на гуртки · HTML. Форми</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* VOICE   робоче середовище веб-студії: учень — новий співробітник, завдання — тікети
   IDEA    дошка задач + макет сайту ліцею, що збирається з кожним перевіреним тікетом
   COLOUR  темний «IDE»-фон, фіолетовий акцент, бірюзові статуси; світла тема — за налаштуваннями пристрою
   TYPE    Onest (інтерфейс) + JetBrains Mono (код) — обидва з кирилицею */
:root{color-scheme:dark;--bg:#0c0f16;--bg2:#10141d;--pan:#151a25;--pan2:#1b2130;--bd:#283042;--bd2:#36405a;--tx:#e9ecf4;--mu:#949db2;--ac:#7c5cff;--act:#b3a2ff;--ac2:#22d3ee;
--ok:#34d399;--okb:rgba(52,211,153,.13);--wa:#fbbf24;--wab:rgba(251,191,36,.13);--no:#f87171;--nob:rgba(248,113,113,.13);--code:#0a0d14;--sh:0 12px 34px rgba(0,0,0,.4)}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#f1f2f7;--bg2:#e8eaf2;--pan:#fff;--pan2:#f5f6fa;--bd:#dce0ea;--bd2:#c9cfdd;--tx:#151a27;--mu:#596277;--ac:#5b3df5;--act:#4a2fe0;--ac2:#0a87a3;
--ok:#0b8a5f;--okb:#e1f5ec;--wa:#9a5b00;--wab:#fdf2d4;--no:#cf2f2f;--nob:#fdeaea;--sh:0 12px 34px rgba(20,30,60,.12)}}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Onest,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
code,.mono{font-family:"JetBrains Mono",Consolas,monospace}
code{font-size:.86em;background:var(--pan2);border:1px solid var(--bd);border-radius:5px;padding:0 5px;overflow-wrap:anywhere}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
h1,h2,h3,h4{line-height:1.2;text-wrap:balance}
.wrap{max-width:1220px;margin:0 auto;padding-inline:max(3vw,14px)}
.muted{color:var(--mu)}
/* ---------- верхня панель ---------- */
#top{position:sticky;top:0;z-index:30}.top{background:var(--bg);border-bottom:1px solid var(--bd)}
.top .wrap{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.01em}
.logo b{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--ac),#c026d3);color:#fff;font-size:17px}
.logo span small{display:block;font-weight:500;font-size:12px;color:var(--mu);letter-spacing:0}
.prog{flex:1 1 220px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mu);font-weight:600}
.pbar{flex:1;height:8px;border-radius:6px;background:var(--pan2);border:1px solid var(--bd);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
.me{display:flex;align-items:center;gap:8px;font-size:14px}
.av{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--pan2);border:1px solid var(--bd);font-weight:700;font-size:13px;flex:none}
.lv{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:2px 10px;font:700 12.5px/1.6 Onest,sans-serif;border:1px solid currentColor;white-space:nowrap}
/* ---------- кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--bd2);background:var(--pan);cursor:pointer;font-weight:600;font-size:15px;text-decoration:none}
.btn:hover{border-color:var(--act)}
.btn.main{background:var(--ac);border-color:var(--ac);color:#fff}.btn.main:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06281b}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
main{padding:22px 0 60px}
.card{background:var(--pan);border:1px solid var(--bd);border-radius:16px;padding:clamp(16px,2.6vw,28px)}
/* ---------- старт ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
.hero h1{font-size:clamp(28px,4.2vw,44px);margin:6px 0 10px;letter-spacing:-.02em}
.kick{font:600 13px "JetBrains Mono",monospace;color:var(--act)}
.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.step{border:1px solid var(--bd);border-radius:12px;padding:12px;background:var(--pan2)}
.step b{display:block;font-size:17px}.step span{font-size:13.5px;color:var(--mu)}
.step .cap{display:block;font:800 26px/1.1 Onest,sans-serif;margin-top:6px}
.rules{margin:10px 0 0;padding-left:20px}.rules li{margin:4px 0}
.team{display:grid;gap:10px}
.person{display:flex;gap:11px;align-items:center}
.person .av{width:40px;height:40px;font-size:20px}
.person small{display:block;color:var(--mu);font-size:13px}
.form-in{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.form-in label{font-size:13px;color:var(--mu);font-weight:600}
.form-in input{width:100%;min-height:46px;margin-top:4px;padding:8px 12px;border-radius:10px;border:1px solid var(--bd2);background:var(--bg2)}
.err{color:var(--no);font-weight:600;min-height:1.4em}
/* ---------- дошка ---------- */
.bhead{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.bhead h2{margin:0;font-size:clamp(24px,3vw,32px)}
.bhead p{margin:4px 0 0;color:var(--mu)}
.bgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.sprint{background:var(--pan);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
.sprint.lock{opacity:.55}
.shead{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.shead h3{margin:0;font-size:17px}
.shead .sp{margin-left:auto;font-size:13px;color:var(--mu);font-weight:600}
.tks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tk{position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;padding:12px 12px 11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--pan2);cursor:pointer;min-height:118px}
.tk::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--st,var(--bd2))}
.tk:hover:not([disabled]){border-color:var(--act);transform:translateY(-1px)}
.tk[disabled]{cursor:not-allowed}
.tk .row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mu)}
.tk .id{font:600 12px "JetBrains Mono",monospace;color:var(--act)}
.tk .kind{margin-left:auto;background:var(--bg2);border:1px solid var(--bd);border-radius:20px;padding:0 8px;font-weight:600}
.tk b{font-size:15.5px;line-height:1.3}
.tk .stt{margin-top:auto;display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600;color:var(--st,var(--mu))}
.dots{display:inline-flex;gap:3px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--bd2)}.dots i.on{background:var(--ac2)}
.lockmsg{font-size:14px;color:var(--mu);padding:10px 12px;border:1px dashed var(--bd2);border-radius:10px}
.promo{margin-top:12px;font-size:13.5px;color:var(--mu)}
.promo .pbar{margin-top:6px;height:6px}
/* ---------- макет сайту ліцею ---------- */
.mock{position:sticky;top:76px}
.mock h3{margin:0 0 4px;font-size:16px}.mock>p{margin:0 0 10px;font-size:13.5px;color:var(--mu)}
.brw{border-radius:12px;overflow:hidden;border:1px solid var(--bd2);box-shadow:var(--sh);background:#fff}
.brw .bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#e8ebf2;border-bottom:1px solid #d4d9e4}
.brw .bar i{width:10px;height:10px;border-radius:50%;background:#f87171;flex:none}.brw .bar i:nth-child(2){background:#fbbf24}.brw .bar i:nth-child(3){background:#34d399}
.brw .url{flex:1;background:#fff;border-radius:6px;padding:3px 10px;font:12px "JetBrains Mono",monospace;color:#4b5468;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site{color:#1d2433;font:14px/1.45 Arial,sans-serif;max-height:min(70vh,640px);overflow:auto}
.site header{background:#0f4c81;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:700}
.site header small{font-weight:400;opacity:.85;margin-left:auto;font-size:12px}
.site .pg{padding:12px 14px 16px}
.mk{margin:0 0 10px}
.mk label,.mk .lb{display:block;font-weight:700;font-size:13px;margin:0 0 3px}
.mk input:not([type=radio]):not([type=checkbox]),.mk select,.mk textarea{width:100%;padding:6px 8px;border:1px solid #b9c1d1;border-radius:6px;font:13px Arial,sans-serif;background:#fff;color:#1d2433}
.mk .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mk .inl{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px}.mk .inl label{display:inline;font-weight:400}
.mk fieldset{border:1px solid #b9c1d1;border-radius:8px;padding:8px 10px}
.mk legend{font-weight:700;color:#0f4c81;padding:0 4px}
.mk .btns{display:flex;gap:8px}.mk .btns span{padding:7px 14px;border-radius:6px;background:#0f4c81;color:#fff;font-weight:700}.mk .btns span+span{background:#e3e7ef;color:#1d2433}
.mk.ph{border:1.5px dashed #c5ccd9;border-radius:8px;padding:9px;color:#7b8499;font-size:12.5px;text-align:center;background:#f7f8fb}
.mk.new{animation:pop .6s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px);background:#fff4c2}to{opacity:1;transform:none}}
/* ---------- тікет ---------- */
.crumbs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:14px;color:var(--mu)}
.thead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13.5px;color:var(--mu)}
.thead .id{font:600 13px "JetBrains Mono",monospace;color:var(--act)}
.chip-k{background:var(--wab);color:var(--wa);border-radius:20px;padding:1px 10px;font-weight:700}
.thead .att{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:600}
.ticket h2{font-size:clamp(23px,3vw,32px);margin:8px 0 14px;letter-spacing:-.01em}
.msg{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
.msg .av{width:44px;height:44px;font-size:22px}
.msg .who{font-size:14px}.msg .who b{font-size:15px}.msg .who span{color:var(--mu)}
.bubble{margin-top:6px;background:var(--pan2);border:1px solid var(--bd);border-radius:4px 14px 14px 14px;padding:11px 14px;max-width:880px}
.bubble p{margin:.2em 0 .55em}.bubble p:last-child{margin-bottom:.1em}.bubble ul{margin:.2em 0 .5em;padding-left:20px}
#tb.lock{opacity:.8}
.locknote{margin-bottom:12px;padding:9px 13px;border-radius:10px;background:var(--pan2);border:1px dashed var(--bd2);font-size:14px;color:var(--mu)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--bd)}
.actions .push{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.fb{margin-top:16px;border-radius:12px;padding:12px 16px;border:1px solid}
.fb.ok{background:var(--okb);border-color:var(--ok)}.fb.no{background:var(--wab);border-color:var(--wa)}
.fb b.big{font-size:18px}.fb p{margin:6px 0 0}
/* ---------- код ---------- */
pre.code{margin:10px 0;padding:12px 14px;border-radius:12px;background:var(--code);color:#e6e9f4;font:13.5px/1.65 "JetBrains Mono",Consolas,monospace;overflow-x:auto;white-space:pre;border:1px solid #1f2638}
.hlc .t{color:#ff8fc8}.hlc .a{color:#8fd3ff}.hlc .s{color:#ffd479}.hlc .c{color:#7d88a6;font-style:italic}
/* ---------- тест ---------- */
.qs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.q{background:var(--pan2);border:1px solid var(--bd);border-radius:12px;padding:14px}
.q h4{margin:0 0 8px;font-size:15.5px;font-weight:600}
.q small{display:block;color:var(--wa);margin:-4px 0 6px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;min-height:42px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.opt:hover{background:var(--pan)}.opt:has(input:checked){border-color:var(--act);background:var(--pan)}
.opt input{margin:3px 0 0;width:18px;height:18px;flex:none;accent-color:var(--ac)}
/* ---------- з'єднування ---------- */
.wires{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(46px,9vw,140px)}
.wires svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wire{fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round}.wire.tmp{stroke:var(--ac2);stroke-dasharray:6 5}
.col{display:grid;gap:9px;align-content:start}.col>h4{margin:0;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.node{position:relative;z-index:1;touch-action:none;user-select:none;-webkit-user-select:none;text-align:left;width:100%;min-height:50px;padding:8px 14px;border:1px solid var(--bd2);border-radius:10px;background:var(--pan2);cursor:pointer;font-size:14.5px;line-height:1.35}
.node.r{font:600 14px "JetBrains Mono",monospace;padding-left:18px}
.node::after{content:"";position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--pan);border:3px solid var(--ac)}
.node.l::after{right:-8px}.node.r::after{left:-8px}
.node.pick{border-color:var(--ac2);box-shadow:0 0 0 2px var(--ac2)}.node.linked::after{background:var(--ac)}
/* ---------- перетягування ---------- */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:12px;background:var(--bg2);border:1.5px dashed var(--bd2);border-radius:12px;margin-bottom:12px}
.buckets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.bucket{display:flex;flex-direction:column;gap:8px;padding:10px;min-height:170px;border:1.5px solid var(--bd);border-radius:12px;background:var(--pan2);cursor:pointer}
.bucket h4{margin:0;font-size:14px}.bucket .in{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;flex:1}
.over{border-color:var(--ac2)!important;background:color-mix(in srgb,var(--ac2) 12%,var(--pan2))!important}
.has-pick .bucket,.has-pick .pool{border-style:dashed;border-color:var(--act)}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;min-height:38px;padding:6px 11px;border:1px solid var(--act);border-radius:8px;background:var(--pan);cursor:grab;font:600 14px "JetBrains Mono",Consolas,monospace;overflow-wrap:anywhere;text-align:left}
.chip.pick{background:var(--ac);border-color:var(--ac);color:#fff}
.lift{opacity:.3}.dghost{position:fixed;left:0;top:0;z-index:90;pointer-events:none;box-shadow:var(--sh);margin:0!important;opacity:.95}
/* пропуски в коді */
.bl{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:92px;min-height:34px;padding:2px;margin:2px 0;border-radius:8px;border:2px dashed #5d6888;background:rgba(255,255,255,.04);color:#7d88a6}
.bl .chip{min-height:28px;padding:2px 8px;font-size:13px;background:#232b40;color:#ffd479;border-color:#ffd479}
/* ---------- порядок ---------- */
.lines{display:grid;gap:5px;background:var(--code);border-radius:12px;padding:10px;border:1px solid #1f2638}
.oline{display:flex;align-items:center;gap:6px;min-height:44px;padding:3px 5px 3px 0;background:#161d2e;border:1px solid #2a3450;border-radius:8px;cursor:grab;user-select:none;-webkit-user-select:none;color:#e6e9f4}
.oline.mk{box-shadow:0 -3px 0 var(--ac2)}.oline.mkb{box-shadow:0 3px 0 var(--ac2)}
.oline pre{flex:1;margin:0;font:13.5px/1.5 "JetBrains Mono",monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.grip{touch-action:none;width:30px;align-self:stretch;display:flex;align-items:center;justify-content:center;color:#7d88a6;flex:none;cursor:grab}
.mv{width:38px;height:38px;flex:none;border:0;border-radius:7px;background:#26304a;color:#fff;cursor:pointer}.mv[disabled]{opacity:.3}
/* ---------- вибір, так/ні ---------- */
.sit{border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:0 0 10px;background:var(--pan2)}
.sit>p{margin:0 0 8px;font-weight:500}
.cline{display:block;background:var(--code);color:#e6e9f4;border-radius:9px;padding:8px 12px;font:13px/2 "JetBrains Mono",monospace;overflow-wrap:anywhere;border:1px solid #1f2638}
select.asel{font:600 13px "JetBrains Mono",monospace;padding:5px 8px;min-height:38px;border-radius:7px;border:2px solid var(--wa);background:#232b40;color:#ffd479;max-width:100%}
.tf{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px dashed var(--bd);padding:9px 0}
.tf>span{flex:1 1 320px}.tf .bb{display:flex;gap:8px}
.yn{min-width:76px;min-height:42px;border:1px solid var(--bd2);border-radius:9px;background:var(--pan2);cursor:pointer;font-weight:700}
.yn.on{border-color:var(--ac);background:var(--ac);color:#fff}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
/* знайти помилки */
.blines{background:var(--code);border-radius:12px;padding:8px 0;overflow-x:auto;border:1px solid #1f2638}
.cl{display:grid;grid-template-columns:40px minmax(max-content,1fr);gap:8px;padding:4px 12px 4px 0;font:13.5px/1.6 "JetBrains Mono",monospace;cursor:pointer;border-left:4px solid transparent;white-space:pre;color:#e6e9f4;width:100%;text-align:left;background:none;border-top:0;border-right:0;border-bottom:0}
.cl:hover{background:rgba(255,255,255,.05)}.cl .n{color:#5d6888;text-align:right;user-select:none}
.cl.sel{background:rgba(251,191,36,.16);border-left-color:#fbbf24}
/* симуляції */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.att{border:1px solid var(--bd);border-radius:12px;padding:12px;background:var(--pan2)}
.att h4{margin:0 0 6px;font-size:15px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:13.5px;margin-bottom:10px}
.kv b{color:var(--mu);font-weight:600}
.kv .diff{color:var(--wa);font-weight:700}
.att .bb{display:flex;gap:6px}.att .yn{flex:1;min-width:0;font-size:13.5px}
.scn{border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:0 0 12px;background:var(--pan2)}
.scn h4{margin:0 0 4px;font-size:15.5px}.scn .act{margin:8px 0;font-weight:500}
.scn .opt span{font:13.5px "JetBrains Mono",monospace;overflow-wrap:anywhere}
/* ---------- редактор ---------- */
.ide{border-radius:12px;overflow:hidden;border:1px solid #232b40;background:var(--code)}
.ide-top{display:flex;align-items:center;gap:10px;padding:7px 12px;background:#111625;border-bottom:1px solid #232b40;color:#8f98ad;font:12.5px "JetBrains Mono",monospace}
.ide-top .d{display:inline-flex;gap:5px}.ide-top .d i{width:10px;height:10px;border-radius:50%;background:#3a4460}
.ide-top .fn{color:#e6e9f4;background:#0a0d14;border:1px solid #232b40;border-bottom:0;border-radius:6px 6px 0 0;padding:3px 10px;margin-bottom:-8px}
.ide-top .ln{margin-left:auto}
.kb{display:flex;gap:5px;overflow-x:auto;padding:7px 8px;background:#0f1320;border-bottom:1px solid #232b40;scrollbar-width:thin}
.kb button{flex:none;min-height:34px;padding:3px 10px;border-radius:7px;border:1px solid #2c3652;background:#1a2133;color:#cfd6ea;font:600 12.5px "JetBrains Mono",monospace;cursor:pointer}
.kb button:hover{border-color:#7c5cff}
.ed{overflow:auto;max-height:560px;min-height:220px}

/* ================= стан ================= */
let S=null;
const fresh=()=>({me:{sn:'',fn:'',cl:''},lvl:0,scr:'start',cur:0,seen:[],final:false,t:T.map(t=>({a:t.init(),att:0,best:null,skip:false,fb:null}))});
try{S=JSON.parse(localStorage.getItem(SAVE))}catch(e){}
if(!S||!S.t||S.t.length!==T.length)S=null;
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
const closedT=i=>{const t=S.t[i];return t.att>=MAXATT||(t.best&&t.best.p===1)};
const open=i=>T[i].sp<=S.lvl;
function sprintInfo(k){const ids=T.map((t,i)=>i).filter(i=>T[i].sp===k);return{ids,checked:ids.filter(i=>S.t[i].att>0).length,P:ids.reduce((a,i)=>a+(S.t[i].best?S.t[i].best.p:0),0),need:ids.length*(PROMO[k]||1),max:ids.length,canImprove:ids.some(i=>!closedT(i))}}
function totals(){const cap=LV[S.lvl].cap;const ids=T.map((t,i)=>i).filter(open);const P=ids.reduce((a,i)=>a+(S.t[i].best?S.t[i].best.p:0),0),M=ids.length,pcx=M?P/M*100:0;const g12=TH.find(t=>pcx>=t[0]-1e-9)[1];return{P,M,pc:Math.round(pcx),g12,g:Math.max(1,Math.round(g12*cap/12)),cap,ids}}
function errList(){const out=[];totals().ids.forEach(i=>{const t=S.t[i],h=`${T[i].id} «${T[i].title}»`;if(!t.att)out.push(`${h}: тікет не виконано (пропущено).`);else(t.best.err||[]).forEach(e=>out.push(`${h}: ${e}`))});return out}

/* ================= перетягування ================= */
function drag(e,el,{move,drop,ghost=true}){if(e.button)return;const sx=e.clientX,sy=e.clientY;let on=false,g=null;
 const mv=ev=>{if(!on&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){on=true;el.classList.add('lift');if(ghost){g=el.cloneNode(true);g.classList.add('dghost');g.removeAttribute('id');g.style.width=el.offsetWidth+'px';document.body.append(g)}}
  if(on){ev.preventDefault();if(g)g.style.transform=`translate(${ev.clientX-el.offsetWidth/2}px,${ev.clientY-18}px)`;move&&move(ev.clientX,ev.clientY)}};
 const up=ev=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);if(on){JUST=Date.now();g&&g.remove();el.classList.remove('lift');if(ev.type==='pointerup')drop(ev.clientX,ev.clientY);else rer()}};
 addEventListener('pointermove',mv,{passive:false});addEventListener('pointerup',up);addEventListener('pointercancel',up)}
const hover=()=>{let last=null;return(a,b)=>{const d=document.elementFromPoint(a,b)?.closest('[data-drop]');if(d!==last){last&&last.classList.remove('over');d&&d.classList.add('over');last=d}}};
function bindChips(put,tap){const done=()=>{PICK=null;save();rer()};
 $$('[data-chip]').forEach(x=>{const c=x.dataset.chip;
  x.onclick=e=>{e.stopPropagation();if(Date.now()-JUST<350)return;if(tap){tap(c);done()}else{PICK=PICK===c?null:c;rer()}};
  x.onpointerdown=e=>drag(e,x,{move:hover(),drop(a,b){const d=document.elementFromPoint(a,b)?.closest('[data-drop]');if(d){put(c,d.dataset.drop);done()}else rer()}})});
 if(!tap)$$('[data-drop]').forEach(d=>d.onclick=()=>{if(PICK){put(PICK,d.dataset.drop);done()}})}
function bindOrder(st){const mv=(i,to)=>{const[x]=st.splice(i,1);st.splice(to,0,x);save();rer()};
 $$('[data-up]').forEach(b=>b.onclick=()=>mv(+b.dataset.up,+b.dataset.up-1));$$('[data-dn]').forEach(b=>b.onclick=()=>mv(+b.dataset.dn,+b.dataset.dn+1));

function bindWires(st){const box=$('#wires'),svg=$('svg',box);
 const pt=(el,side)=>{const a=el.getBoundingClientRect(),b=box.getBoundingClientRect();return[(side==='l'?a.right:a.left)-b.left,a.top+a.height/2-b.top]};
 const cur=(p,q)=>`M${p[0]} ${p[1]}C${p[0]+50} ${p[1]},${q[0]-50} ${q[1]},${q[0]} ${q[1]}`;
 const lines=(x='')=>{svg.innerHTML=Object.entries(st).map(([i,j])=>{const a=$('#nl'+i),b=$('#nr'+j);return a&&b?`<path class="wire" d="${cur(pt(a,'l'),pt(b,'r'))}"/>`:''}).join('')+x};
 lines();RO=new ResizeObserver(()=>{if(box.isConnected)lines()});RO.observe(box);
 const link=(i,j)=>{for(const k in st)if(st[k]===j)delete st[k];st[i]=j;PICK=null;save();rer()};
 $$('[data-n]',box).forEach(n=>{const id=n.dataset.n,side=id[0],k=id.slice(1);
  n.onclick=()=>{if(Date.now()-JUST<350)return;if(PICK===id){if(side==='l'&&st[k]!==undefined){delete st[k];save()}PICK=null}else if(PICK&&PICK[0]!==side){side==='l'?link(k,PICK.slice(1)):link(PICK.slice(1),k);return}else if(!PICK&&side==='l'&&st[k]!==undefined){delete st[k];save();PICK=id}else PICK=id;rer()};
  n.onpointerdown=e=>drag(e,n,{ghost:false,move(a,b){const r=box.getBoundingClientRect(),q=[a-r.left,b-r.top],p=pt(n,side);lines(`<path class="wire tmp" d="${side==='l'?cur(p,q):cur(q,p)}"/>`)},drop(a,b){const t=document.elementFromPoint(a,b)?.closest('[data-n]');if(t&&t.dataset.n[0]!==side){const m=t.dataset.n.slice(1);side==='l'?link(k,m):link(m,k)}else rer()}})})}

  if(s.P>=s.need){S.lvl++;save();topbar();
   modal(`<div class="big">${k===0?'⚡':'🚀'}</div><h3>Підвищення: ${LV[S.lvl].full}!</h3><p>${WHO.lead.n}: «Спринт ${k+1} закрито — ${fmtP(s.P)} з ${s.max} балів. Вітаю з новим статусом!»</p><p>Відкрито <b>спринт ${S.lvl+1}</b>. Максимальна оцінка тепер — <b>${LV[S.lvl].cap}</b>. Тікети спринту ${k+1}, де ще є спроби, можна покращувати й далі.</p>`,[{t:'Залишитися тут'},{t:'До дошки задач',c:'main',f:()=>go('board')}])}
  else if(s.canImprove)modal(`<h3>Поки без підвищення</h3><p>Усі тікети спринту ${k+1} перевірено: ${fmtP(s.P)} з ${s.max} балів. Для підвищення до ${LV[k+1].n} потрібно щонайменше <b>${fmtP(s.need)}</b>.</p><p>У деяких тікетах ще є спроби — виправте помилки й перевірте знову.</p>`,[{t:'Зрозуміло',c:'main'}]);
  else endModal();return}
 if(stuck()){endModal();return}
 if(S.lvl===2&&T.every((x,j)=>S.t[j].att>0)&&k===2&&sprintInfo(2).checked===4&&!S.t[i].doneMsg){S.t[i].doneMsg=1;save();modal('<div class="big">🏁</div><h3>Усі тікети перевірено!</h3><p>Можна ще покращити тікети, де лишилися спроби, або здати проєкт замовнику.</p>',[{t:'Залишитися'},{t:'Здати проєкт',c:'main',f:finish}])}}

/* робота завершена: спроби вичерпано й підвищення неможливе (або в статусі Middle закрито всі тікети) */
function stuck(){if(S.final)return null;const k=S.lvl;
 if(k<2){const s=sprintInfo(k);return s.checked===s.max&&!s.canImprove&&s.P<s.need?{type:'fail',k,s}:null}
 return T.every((t,i)=>closedT(i))?{type:'done',k}:null}
function endModal(){const x=stuck();if(!x||$('.ov'))return;const tt=totals();
 const why=x.type==='fail'?`<p>Спроби в усіх тікетах спринту ${x.k+1} вичерпано: <b>${fmtP(x.s.P)} з ${x.s.max}</b> балів, а для підвищення до ${LV[x.k+1].n} потрібно щонайменше <b>${fmtP(x.s.need)}</b>. Підвищити статус у цій спробі вже неможливо.</p>`:`<p>Усі тікети закрито — покращувати більше нічого.</p>`;
 modal(`<div class="big">🏁</div><h3>Роботу завершено</h3>${why}<p>Поточний результат: статус <b>${LV[x.k].n}</b>, бали <b>${fmtP(tt.P)} з ${tt.M}</b>, орієнтовна оцінка <b>${tt.g}</b> з 12 (максимум для статусу — ${tt.cap}).</p>
 <p>Оберіть, що робити далі:</p><ul><li><b>Завершити</b> — перейти до підсумку й надіслати результат учителю.</li><li><b>Почати з початку</b> — усі результати й спроби буде обнулено. Кількість таких перезапусків побачить учитель${S.restarts?` (зараз: ${S.restarts})`:''}.</li></ul>`,
 [{t:'⟲ Почати з початку',f:restart},{t:'Завершити й побачити підсумок',c:'main',f:()=>{S.final=true;go('sum')}}])}
function regLog(){try{fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',keepalive:true,body:JSON.stringify({key:KEY,task:'Реєстрація',fields:{'ПІБ учня':S.me.sn+' '+S.me.fn,'Клас':S.me.cl,'Назва проєкту':TASK}})}).catch(()=>{})}catch(x){}}
function restart(){const me=S.me,r=(S.restarts||0)+1;S=fresh();S.me=me;S.restarts=r;save();regLog();go('board')}
function finish(){const ids=T.map((t,i)=>i).filter(open),miss=ids.filter(i=>!S.t[i].att),k=S.lvl,tt=totals();
 const confirmFinal=()=>modal(`<h3>Здати проєкт замовнику?</h3><p>Статус: <b>${LV[k].full}</b> · максимальна оцінка ${LV[k].cap}.</p><p>Після здачі змінити відповіді вже не вийде.</p>`,[{t:'Ще попрацюю'},{t:'Здати проєкт',c:'main',f:()=>{S.final=true;go('sum')}}]);
 if(miss.length)modal(`<h3>Є невиконані тікети</h3><p>Ці тікети ще не перевірено — їх буде зараховано як 0 балів:</p><ul>${miss.map(i=>`<li><b>${T[i].id}</b> ${esc(T[i].title)}</li>`).join('')}</ul><p>Поверніться до них, щоб отримати вищу оцінку.</p>`,[{t:'Однаково здати',f:confirmFinal},{t:'Повернутися до виконання',c:'main',f:()=>go('ticket',miss[0])}]);
 else confirmFinal()}

function drawSum(){const tt=totals(),E=errList(),k=S.lvl;
 $('#stage').innerHTML=`<div class="sgrid"><section class="card"><div class="kick">ПРОЄКТ ЗДАНО ЗАМОВНИКУ</div><h2 style="margin:6px 0 4px">${esc(S.me.sn)} ${esc(S.me.fn)}</h2><p class="muted" style="margin:0 0 14px">Клас ${esc(S.me.cl)} · ${new Date().toLocaleDateString('uk-UA')}</p>
 <p style="margin:0">Статус: ${lvBadge(k)} <span class="muted">— максимальна оцінка ${tt.cap}</span></p>
 <div style="display:flex;align-items:flex-end;gap:12px;margin:12px 0 4px"><span class="grade">${tt.g}</span><span style="padding-bottom:12px"><b>з 12</b><br><span class="muted">орієнтовна оцінка</span></span></div>
 <p style="margin:0">Бали: <b>${fmtP(tt.P)} з ${tt.M}</b> (${tt.pc}%)</p><p style="margin:4px 0 0">Перезапусків проєкту: <b>${S.restarts||0}</b></p>
 <p class="note">Остаточна оцінка вчителя враховуватиме також кількість допущених помилок і виконаних спроб.</p>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn main" id="send">📨 Надіслати результат учителю</button><button class="btn" id="save">💾 Зберегти результат</button></div><p id="sm" class="muted"></p>
 <h3>Макет сторінки</h3>${mockHtml(false)}</section>
 <section class="card"><h3 style="margin-top:0">Тікети</h3><table class="tbl"><tr><th>Тікет</th><th>Завдання</th><th class="n">Бали</th><th class="n">Спроби</th></tr>${T.map((t,i)=>open(i)?`<tr><td class="mono" style="color:var(--act)">${t.id}</td><td>${esc(t.title)}<br><span class="muted" style="font-size:13px">${esc(t.kind)}</span></td><td class="n">${S.t[i].att?fmtP(S.t[i].best.p):'—'} / 1</td><td class="n">${S.t[i].att}</td></tr>`:'').join('')}</table>
 <h3>Помилки (${E.length})</h3>${E.length?`<ul class="errs">${E.map(e=>`<li>${fmt(e)}</li>`).join('')}</ul>`:'<p style="color:var(--ok);font-weight:700">Без помилок! 🎉</p>'}</section></div>`;
 $('#send').onclick=e=>send(e.target);$('#save').onclick=saveImg}

/* ================= підсумок: зображення й надсилання ================= */
function sumLines(){const tt=totals(),E=errList();return{tt,E,L:[['Статус: '+LV[S.lvl].full+' (максимальна оцінка '+tt.cap+')',0],['Бали: '+fmtP(tt.P)+' з '+tt.M+' ('+tt.pc+'%)',0],['Перезапусків проєкту: '+(S.restarts||0),0],['Остаточна оцінка вчителя враховуватиме також кількість допущених помилок і виконаних спроб.',2],['',0],['Тікети:',1],...tt.ids.map(i=>['   '+T[i].id+' '+T[i].title+' — '+(S.t[i].att?fmtP(S.t[i].best.p):'0')+' з 1, спроб: '+S.t[i].att,0]),['',0],['Помилки ('+E.length+'):',1],...E.map(e=>['• '+plain(e),0])]}}
function wrapTxt(x,t,w){const o=[];let c='';t.split(' ').forEach(s=>{const n=c?c+' '+s:s;if(x.measureText(n).width>w&&c){o.push(c);c=s}else c=n});o.push(c);return o}
function canvas(){const{tt,L}=sumLines(),W=1000,c=document.createElement('canvas'),x=c.getContext('2d');x.font='17px Arial';const rows=[];L.forEach(([t,s])=>{x.font=(s===1?'bold 18px':s===2?'italic 16px':'17px')+' Arial';(t?wrapTxt(x,t,W-80):['']).forEach((r,k)=>rows.push([k&&t.startsWith('• ')?'   '+r:r,s]))});
 c.width=W;c.height=190+rows.length*26+30;x.fillStyle='#ffffff';x.fillRect(0,0,W,c.height);
 const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#7c5cff');g.addColorStop(1,'#22d3ee');x.fillStyle=g;x.fillRect(0,0,W,150);
 x.fillStyle='#fff';x.font='bold 15px Arial';x.fillText('ВебКузня · '+TASK,40,36);x.font='bold 30px Arial';x.fillText(S.me.sn+' '+S.me.fn+', клас '+S.me.cl,40,80);x.font='17px Arial';x.fillText(new Date().toLocaleString('uk-UA'),40,112);
 x.font='bold 64px Arial';x.textAlign='right';x.fillText(String(tt.g),W-40,96);x.font='16px Arial';x.fillText('з 12',W-40,124);x.textAlign='left';
 rows.forEach(([r,s],k)=>{x.font=(s===1?'bold 18px':s===2?'italic 16px':'17px')+' Arial';x.fillStyle=s===2?'#5b6478':'#1d2433';x.fillText(r,40,190+k*26)});return c}
function saveImg(){canvas().toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='html_forms_'+(S.me.sn+'_'+S.me.fn).replace(/[^\p{L}\p{N}_-]+/gu,'_')+'.png';document.body.append(a);a.click();a.remove();$('#sm').textContent='Зображення збережено ✔'})}
async function send(b){const{tt,E}=sumLines();const F={'Прізвище':S.me.sn,"Ім'я":S.me.fn,'Клас':S.me.cl,'Статус':LV[S.lvl].full,'Макс. оцінка статусу':tt.cap,'Бали':tt.P,'Макс. балів':tt.M,'Відсоток':tt.pc,'Орієнтовна оцінка (12-бальна)':tt.g,'Кількість перезапусків':S.restarts||0};
 T.forEach((t,i)=>{F[t.id+' '+t.kind]=open(i)?(S.t[i].att?fmtP(S.t[i].best.p):'0')+'/1 (спроб: '+S.t[i].att+')':'не відкрито'});
 F['Кількість помилок']=E.length;F['Допущені помилки']=E.map(plain).join('\n')||'немає';
 b.disabled=true;$('#sm').textContent='Надсилання…';
 try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({key:KEY,task:TASK,fields:F,image:{name:'html_forms_'+S.me.sn+'_'+S.me.fn+'.png',data:canvas().toDataURL('image/png').split(',')[1]}})});$('#sm').textContent='Результат надіслано вчителю ✔';S.sent=true;save()}
 catch(e){b.disabled=false;$('#sm').textContent='Не вдалося надіслати. Перевірте інтернет і спробуйте ще раз.'}}

/* ================= запуск ================= */
if(!S)S=fresh();
if(S.final)S.scr='sum';else if(!['start','board','ticket'].includes(S.scr)||!S.me.sn)S.scr='start';
if(S.scr==='ticket'&&!open(S.cur))S.scr='board';
draw();
}
</script>
</body>
